<style>
/* ===== Paleta y tipografía igual que Commissioning ===== */
:root{--bg:#eef2f9;--card:#ffffff;--tx:#1a2233;--mu:#68718a;--bd:#dde3ef;--pe:#e3e8f2;--ok:#16a34a;--nt:#f59e0b;--ac:#2563eb;--er:#dc2626;--g1:#0ea5e9;--g2:#8b5cf6;
 --sh:0 1px 2px rgba(15,23,42,.06),0 6px 18px rgba(15,23,42,.06);--mapbg:#f6f9fd;--mapgr:#e2e8f2;--note-bg:#fff7e0;--note-bd:#f2c94c;--note-tx:#8a5a00;color-scheme:light}
:root[data-theme=dark]{--bg:#070b16;--card:#101729;--tx:#e8edf9;--mu:#8b97b5;--bd:#1f2a44;--pe:#1c2740;--ok:#22c55e;--nt:#fbbf24;--ac:#38bdf8;--er:#f87171;--g1:#22d3ee;--g2:#a78bfa;
 --sh:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);--mapbg:#0a1120;--mapgr:#16213a;--note-bg:#2b2200;--note-bd:#6b5600;--note-tx:#ffe08a;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#070b16;--card:#101729;--tx:#e8edf9;--mu:#8b97b5;--bd:#1f2a44;--pe:#1c2740;--ok:#22c55e;--nt:#fbbf24;--ac:#38bdf8;--er:#f87171;--g1:#22d3ee;--g2:#a78bfa;
 --sh:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);--mapbg:#0a1120;--mapgr:#16213a;--note-bg:#2b2200;--note-bd:#6b5600;--note-tx:#ffe08a;color-scheme:dark}}
:root{--line:var(--bd);--mut:var(--mu);--acc:var(--ac);--cur:var(--nt);--bad:var(--er);--card2:color-mix(in srgb,var(--card) 60%,var(--bg))}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums;
 background:radial-gradient(1200px 500px at 10% -10%,color-mix(in srgb,var(--g1) 12%,transparent),transparent),radial-gradient(900px 500px at 100% 0,color-mix(in srgb,var(--g2) 12%,transparent),transparent),var(--bg);background-attachment:fixed}
button,select,input{font:inherit;color:inherit}
button{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;font-family:inherit;transition:transform .2s cubic-bezier(.2,.7,.2,1),box-shadow .25s,background .25s}
button:active{transform:scale(.95)}
button:hover{background:color-mix(in srgb,var(--ac) 8%,transparent)}
button:disabled{opacity:.45;cursor:default}
button.pri{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent;color:#fff;font-weight:600;box-shadow:0 8px 20px -8px color-mix(in srgb,var(--g1) 70%,transparent)}
button.pri:hover{box-shadow:0 10px 26px -6px color-mix(in srgb,var(--g1) 80%,transparent)}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
button.warn{background:color-mix(in srgb,var(--nt) 18%,transparent);border-color:var(--nt);color:var(--nt);font-weight:600}
button.danger{border-color:var(--er);color:var(--er)}
button.on{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent;color:#fff}
button.sm{padding:4px 9px;font-size:12px}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;color:var(--tx)}
input[type=number]{width:84px}
input[type=range]{padding:0;accent-color:var(--g1)}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px 6px;flex-wrap:wrap;max-width:1150px;margin:0 auto}
.top h1{font-size:20px;margin:0;display:flex;align-items:center;gap:8px;white-space:nowrap;background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.top .tit{flex:1 1 230px;min-width:0}
@media(max-width:600px){.top .tot{display:none}.top h1{font-size:19px}}
.sub{color:var(--mu);font-size:12px;margin-top:1px}
.wt{flex:none;color:var(--tx)}.wt .rot{transform-origin:20px 14px;animation:giro 4s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:600;background:var(--card);border:1px solid var(--bd);white-space:nowrap}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--mu)}.pill.ok i{background:var(--ok)}.pill.lo i{background:var(--nt)}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--card);color:var(--mu);border:1px solid var(--bd);font-weight:600}
.tabs{display:flex;gap:6px;padding:4px;margin:4px auto 10px;max-width:900px;width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none;background:var(--card);border:1px solid var(--bd);border-radius:14px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;border:0;background:none;color:var(--mu);padding:9px 12px;border-radius:10px;font-weight:600;font-size:13px;white-space:nowrap}
.tabs button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.35)}
main{padding:12px;max-width:1150px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:var(--sh)}
.card.nofx,.card.nofx:hover{transform:none!important}
h2{background:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut)}
.grow{flex:1}
h2{font-size:15px;margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--mut);font-weight:600;font-size:12px}
.tw{overflow-x:auto}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chip{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.chip.none{background:var(--pe);color:var(--mu)}
.chip.curso{background:color-mix(in srgb,var(--nt) 18%,transparent);color:var(--nt)}
.chip.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.bar{height:8px;background:var(--pe);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2ecc71,#7ee08f)}
#banner{position:sticky;top:0;z-index:30}
.alarmb{animation:flash 1s infinite;color:#fff;padding:10px 14px;font-weight:700;display:flex;gap:10px;align-items:center;cursor:pointer;border-bottom:2px solid #fff3;font-size:15px}
@keyframes flash{0%,100%{background:#e00020}50%{background:#5c000c}}
.alarmbox{border:3px solid var(--bad);border-radius:12px;padding:14px;animation:flash 1s infinite;color:#fff}
.alarmbox .big{font-size:22px;font-weight:800}
.timer{font-variant-numeric:tabular-nums;font-size:26px;font-weight:800}
.bigbtn{font-size:18px;font-weight:800;padding:14px 18px;width:100%;background:#b0001a;border:2px solid #ff6b6b;color:#fff;border-radius:12px;letter-spacing:.5px}
.mapwrap{background:var(--mapbg);border:1px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none}
svg.map{width:100%;height:auto;display:block;user-select:none}
svg.map .tn{cursor:pointer}
svg.map.unlocked .tn{cursor:grab}
.tn.alarm .ring{animation:ringf 1s infinite}
@keyframes ringf{0%,100%{stroke:#ff2020;stroke-width:9}50%{stroke:#ff202000;stroke-width:3}}
.tsvgw{display:flex;justify-content:center}
svg.tsvg{width:100%;max-width:520px;height:auto;max-height:72vh;user-select:none}
.sh{stroke:#0000004d;stroke-width:.6}
.m-tw{fill:url(#gTw)}.m-twh{fill:url(#gTwH)}.m-fl{fill:#aeb5bc}.m-nac{fill:url(#gNac)}.m-nact{fill:url(#gNacT)}.m-win{fill:#2b3b4b}
.m-rad{fill:url(#gRad)}.m-pt{fill:url(#gPT)}.m-hub{fill:url(#gHub)}.m-hubr{fill:#b9c0c6}.m-bl{fill:url(#gBl)}
.m-base{fill:url(#gBase)}.m-baset{fill:#9d9a92}.m-gravel{fill:#4a4234}
.fl{stroke:#00000066;stroke-width:1}.dr{fill:#b9c0c6;stroke:#0006;stroke-width:.6}.seam{stroke:#0000002e;stroke-width:.8}.fin{stroke:#5d656d;stroke-width:1;fill:none}
.gsh{fill:#000;opacity:.4}
.m-bolt{fill:#facc15;stroke:#a16207!important}.p.ok .m-bolt,.mp.ok .m-bolt{filter:drop-shadow(0 0 6px #facc15)}
.m-run{fill:#16a34a}.m-runt{font:800 10px system-ui,sans-serif;fill:#fff;pointer-events:none}
.p.avail .m-bolt,.p.lock .m-bolt,.mp.none .m-bolt{fill:#6b7280}.p.avail .m-run,.p.lock .m-run,.mp.none .m-run{fill:#4b5563}
.simsvg .gnac{transition:opacity .4s}.simsvg.nacup .gnac,.simsvg.nacup .sp[data-k="rad"]{opacity:0}
.simsvg .sp[data-k="radA"]{opacity:0}.simsvg .sp[data-k="radA"].on{opacity:1}
@keyframes pul{0%,100%{stroke-opacity:1}50%{stroke-opacity:.2}}
.p{cursor:pointer}
.p.curso{filter:drop-shadow(0 0 5px #ffd400)}
.p.curso .sh{stroke:#ffd400;stroke-width:2;animation:pul 1s infinite}
.p.avail .sh{stroke:#4fc3f7;stroke-width:1.4;stroke-dasharray:5 3}
.p.avail:hover{filter:brightness(1.12) drop-shadow(0 0 4px #4fc3f7)}
.p.lock{opacity:.45;cursor:not-allowed}
.p.base-none .sh{fill:#ffffff0d!important;stroke:#4fc3f7;stroke-dasharray:5 4}
.ident .sh{fill:var(--c)!important}
.p .hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke}
.glbl{font-size:9px;fill:#efe6d2;paint-order:stroke;stroke:#000b;stroke-width:2.5px}
.mt{paint-order:stroke;stroke:var(--mapbg);stroke-width:4px;stroke-linejoin:round}
.lbl{font-size:11px;fill:#c9b48a;font-weight:700;letter-spacing:1px}
#toast{pointer-events:none;position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);border:0;font-weight:600;padding:10px 16px;border-radius:10px;z-index:50;display:none;max-width:90vw}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
#modal .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:420px;width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.legend span{margin-right:12px;white-space:nowrap}
.kpi{display:flex;gap:10px;flex-wrap:wrap}
.kpi div{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:110px}
.kpi b{display:block;font-size:20px}
input.dt{width:170px;font-size:12px;padding:4px 6px}
.mp .sh,.mp .fl,.mp .seam{pointer-events:none}
.mp.curso{filter:drop-shadow(0 0 8px #ffd400)}
.mp.curso .sh{stroke:#ffd400;stroke-width:3;animation:pul 1s infinite}
.mp.none{opacity:.16}
.mp .hit{display:none}
.hitb{fill:#ffffff01;stroke:none}
.hnd{cursor:move}
[data-cl]{cursor:pointer}
.tn.alarm .hitb{animation:ringf 1s infinite}
.card-t{fill:var(--card);stroke-width:4}
.tn.alarm .card-t{animation:ringf 1s infinite}
.tn.done .card-t{fill:color-mix(in srgb,var(--ok) 14%,var(--card))}
.mbg{position:fixed;inset:0;z-index:44;background:color-mix(in srgb,var(--bg) 35%,rgba(0,0,0,.35));backdrop-filter:blur(7px) saturate(.9);-webkit-backdrop-filter:blur(7px) saturate(.9);animation:fadein .25s ease both}
.win{position:fixed;z-index:45;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1180px,95vw);height:min(92vh,980px);background:color-mix(in srgb,var(--bg) 96%,transparent);border:1px solid var(--bd);border-radius:18px;box-shadow:0 30px 80px -10px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden;container-type:inline-size;animation:winin .35s cubic-bezier(.2,.7,.2,1) both}
#cfgw.win{width:min(900px,95vw)}
@keyframes winin{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
body.modal-open{overflow:hidden}
.win .ovbar{background:var(--card);border-bottom:1px solid var(--bd);padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.win .ovscroll{flex:1;overflow:auto;overscroll-behavior:contain}
.win .ovbody{padding:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
#cfgw .ovbody{display:block}
.win .ovbody>div{min-width:0}
@container (min-width:860px){#ov .ovbody{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.win .card{margin-bottom:12px}
#ov svg.tsvg{max-width:none;max-height:72vh}
@media(max-width:600px){.win{width:100vw;height:94vh;top:auto;bottom:0;transform:translateX(-50%);border-radius:18px 18px 0 0}@keyframes winin{from{opacity:0;transform:translate(-50%,30px)}to{opacity:1;transform:translateX(-50%)}}}
main.wide{max-width:1840px}
.maplay{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;gap:14px;align-items:start}
.simp,.sump{position:sticky;top:132px;max-height:calc(100vh - 146px);overflow:auto;scrollbar-width:thin}
.sump .kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sump .kpi>div{min-width:0}
.sump .sumg{grid-template-columns:1fr}
@media(max-width:1280px){.maplay{grid-template-columns:minmax(0,1fr) 280px}.simp{grid-column:1/-1;order:3;position:static;max-height:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.simp .card{margin:0}}
@media(max-width:900px){.maplay{grid-template-columns:minmax(0,1fr)}.sump{position:static;max-height:none}.simcard{display:none}}
.simcard{padding:10px}.simbox{opacity:.92}
.simsvg{width:100%;height:auto;display:block;border-radius:12px}
.simsvg .sp{opacity:0}
.simsvg .sp.on{opacity:1}
.simsvg .sp.drop{animation:sdrop 1.15s cubic-bezier(.25,.8,.3,1) both}
@keyframes sdrop{from{opacity:0;transform:translateY(-150px)}60%{opacity:1}to{opacity:1;transform:none}}
.simsvg .hook{opacity:0}.simsvg .hook.go{animation:shook 1.3s ease both}
@keyframes shook{0%{opacity:0}15%{opacity:.8}75%{opacity:.8}100%{opacity:0}}
.simsvg .srotor{transform-origin:272px 147px;transform-box:view-box}
.simsvg.done .srotor,.simsvg.run .srotor{animation:spin 6s linear infinite}
.simsvg .sp.pop{animation:spop .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes spop{from{opacity:0;transform:scale(.4);transform-origin:262px 412px}to{opacity:1;transform:none}}
.simsvg .sp[data-k=ener].on .m-bolt{filter:drop-shadow(0 0 8px #facc15);animation:boltf 1.2s ease-in-out infinite}
@keyframes boltf{50%{filter:drop-shadow(0 0 2px #facc15)}}
.simsvg.ener .crane{opacity:0;transition:opacity .8s}
@keyframes spin{to{transform:rotate(360deg)}}
.simsvg.fade .sp{opacity:0;transition:opacity .8s}
.simsvg .crane{opacity:.55}
.simcap{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-top:6px;color:var(--mu)}.simcap b{color:var(--tx)}
.lst{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:13px;padding:5px 0;border-bottom:1px solid var(--bd);cursor:pointer}.lst:last-child{border:0}.lst .mut{margin-left:auto;font-size:11px}
.pform{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.pform label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mu);font-weight:600}.pform .full{grid-column:1/-1}.pform input{color:var(--tx);font-weight:400}
@media(max-width:520px){.pform{grid-template-columns:1fr}}
.psel{max-width:180px;padding:3px 8px;font-size:12px;font-weight:700;margin-right:6px;border-radius:8px}
.sub{display:flex;align-items:center;flex-wrap:wrap;gap:2px}
.btnlike{display:inline-flex;align-items:center;border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer}
#modal .box .pform input{width:100%;min-width:0}
#modal .box{max-width:480px!important}

.sumg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px}
.sumg .lab{display:flex;justify-content:space-between;font-size:12px}
.note{background:var(--note-bg);border:1px solid var(--note-bd);color:var(--note-tx);padding:8px 12px;border-radius:8px;margin-bottom:10px}
</style>

<body>
<div id="gate" hidden>
<svg class="wl-wind" viewBox="0 0 400 800" preserveAspectRatio="none" aria-hidden="true"><path d="M-20 140 H420"/><path d="M-20 260 H420"/><path d="M-20 520 H420"/><path d="M-20 640 H420"/><path d="M-20 720 H420"/></svg>
<form class="g-card" id="g-form" autocomplete="on">

 <div class="g-h">Avances de montaje<span>VESTAS</span></div>

<div class="wl-in">
 <svg class="wl-t" viewBox="0 0 160 190" aria-hidden="true"><g fill="#fff"><path d="M75 80 L72 184 L88 184 L85 80Z"/><rect x="58" y="182" width="44" height="6" rx="3" opacity=".7"/><g class="wl-rot"><path d="M80 80 L73 68 L77 8 Q80 2 83 8 L87 68Z"/><path d="M80 80 L73 68 L77 8 Q80 2 83 8 L87 68Z" transform="rotate(120 80 80)"/><path d="M80 80 L73 68 L77 8 Q80 2 83 8 L87 68Z" transform="rotate(240 80 80)"/></g><circle cx="80" cy="80" r="9"/><circle cx="80" cy="80" r="3.5" fill="#0e7490"/></g></svg>

<style>
#welcome,#gate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;background:linear-gradient(160deg,#0e7490,#6d28d9);overflow:hidden;opacity:1;transition:opacity .6s ease,transform .6s ease;padding:24px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#welcome[hidden],#gate[hidden],.wl-pk[hidden]{display:none}
#welcome{cursor:pointer}
#welcome.out,#gate.out{opacity:0;transform:scale(1.04);pointer-events:none}
#welcome .wl-in{max-width:560px;width:100%;position:relative}
.wl-wind{position:absolute;inset:0;width:100%;height:100%;opacity:.28}.wl-wind path{stroke:#fff;stroke-width:2;fill:none;stroke-dasharray:90 310;stroke-linecap:round;animation:wlw 2.6s linear infinite}.wl-wind path:nth-child(2){animation-delay:-.6s;stroke-dasharray:60 340}.wl-wind path:nth-child(3){animation-delay:-1.2s}.wl-wind path:nth-child(4){animation-delay:-1.8s;stroke-dasharray:70 330}.wl-wind path:nth-child(5){animation-delay:-.3s}
@keyframes wlw{from{stroke-dashoffset:400}to{stroke-dashoffset:-400}}

.wl-rot{transform-origin:80px 80px;animation:wlr 5s linear infinite}

<script>
/* ===== Definición de piezas (orden de montaje y dependencias) ===== */
const PARTS=[
 {k:'base',n:'Base',c:'#4b8cff',req:[]},
 {k:'t1',n:'T1',c:'#e62828',req:['base']},
 {k:'t2',n:'T2',c:'#ff8c00',req:['t1']},
 {k:'t3',n:'T3',c:'#f0dc00',req:['t2']},
 {k:'t4',n:'T4',c:'#28be3c',req:['t3']},
 {k:'t5',n:'T5',c:'#00bec8',req:['t4']},
 {k:'rad',n:'Radiador',c:'#ff5ac8',req:[]},
 {k:'nacelle',n:'Nacelle',c:'#9646dc',req:['t5','rad']},
 {k:'pt',n:'Power train',c:'#ff7800',req:['nacelle']},
 {k:'hub',n:'Hub',c:'#ff3c3c',req:['pt']},
 {k:'pa',n:'Pala A',c:'#78c8ff',req:['hub']},
 {k:'pb',n:'Pala B',c:'#aaff78',req:['hub']},
 {k:'pc',n:'Pala C',c:'#ffc878',req:['hub']},
 {k:'ener',n:'Energizado',c:'#facc15',req:['base','t1','t2','t3','t4','t5','rad','nacelle','pt','hub','pa','pb','pc'],x:1},
 {k:'run',n:'RUN',c:'#22c55e',req:['ener'],x:1}
];
const MECH=PARTS.filter(p=>!p.x),NM=MECH.length;
const PK=Object.fromEntries(PARTS.map(p=>[p.k,p]));
const DRAW=['base','t1','t2','t3','t4','t5','nacelle','rad','pt','pa','pb','pc','hub','ener','run'];
const BLD=['pa','pb','pc'];
const CCOL=['#3fa9f5','#f5a623','#7ed321','#c86bff','#f8e71c','#50e3c2','#ff6b6b','#b8e986','#ff9ecf','#9fb3ff'];
const MOTIVOS=['Viento','Grúa / equipo de izaje','Falta de material','Seguridad','Clima (lluvia / tormenta)','Logística / acceso','Calidad / NC','Otro'];

let db=null, MODE='loading', NOTE='', cfgDirty=false;
const S={parks:{},cfg:null,info:null,turb:{},alarms:{},loaded:false,subPid:null};
const UI={tab:'mapa',sel:null,moveMode:'turb',draft:{},ov:false,ms:.32};
UI.vb={x:0,y:0,w:1000};UI.ts=1;UI.cfgOpen=false;try{UI.pid=localStorage.getItem('wtg-pid')||null;const t=+localStorage.getItem('wtg-ts');if(t>=.4&&t<=3)UI.ts=t}catch(e){UI.pid=null}
const FILT=[['lines','Líneas de circuito'],['box','Recuadro'],['name','Nombre WTG'],['circ','Circuito'],['pct','% avance'],['ghost','Piezas pendientes']];
UI.le=false;UI.ec=0;UI.selV=null;
UI.f={lines:true,box:false,name:true,circ:true,pct:true,ghost:false};UI.ident=false;
try{Object.assign(UI.f,JSON.parse(localStorage.getItem('wtg-f')||'{}'));UI.ident=localStorage.getItem('wtg-ident')==='1'}catch(e){}
try{const m=+localStorage.getItem('wtg-ms');if(m>=.1&&m<=1)UI.ms=m;const v=JSON.parse(localStorage.getItem('wtg-vb')||'null');if(v&&isFinite(v.w))UI.vb=v}catch(e){}
function setTs(v){UI.ts=Math.max(.4,Math.min(3,Math.round(v*100)/100));const m=document.getElementById('map');if(m)m.innerHTML=mapSvg();const r=document.getElementById('tsr');if(r)r.value=UI.ts;try{localStorage.setItem('wtg-ts',UI.ts)}catch(_){}}
function setMs(v){UI.ms=Math.max(.1,Math.min(1,Math.round(v*100)/100));const m=document.getElementById('map');if(m)m.innerHTML=mapSvg();const r=document.getElementById('msr');if(r)r.value=UI.ms;try{localStorage.setItem('wtg-ms',UI.ms)}catch(_){}}
try{UI.draft.sup=localStorage.getItem('wtg-sup')||''}catch(e){}

/* ===== utilidades ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowI=()=>new Date().toISOString();
const pad=n=>String(n).padStart(2,'0');
const clone=o=>JSON.parse(JSON.stringify(o));
function fmt(iso){if(!iso)return '—';return new Date(iso).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}
function dur(ms){if(ms==null||isNaN(ms)||ms<0)return '—';const m=Math.floor(ms/60000),h=Math.floor(m/60),d=Math.floor(h/24);return d?`${d}d ${h%24}h ${pad(m%60)}m`:`${h}h ${pad(m%60)}m`}
function durS(ms){const s=Math.max(0,Math.floor(ms/1000));return `${Math.floor(s/3600)}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`}
function toInp(iso){if(!iso)return '';const d=new Date(iso);return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function fromInp(v){return v?new Date(v).toISOString():null}
function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',3200)}
function modal(html,onOk,okLabel='Confirmar',danger){const m=$('#modal');m.innerHTML=`<div class="box">${html}<div class="row" style="justify-content:flex-end;margin-top:14px"><button data-m="no">Cancelar</button><button class="${danger?'danger':'pri'}" data-m="ok">${okLabel}</button></div></div>`;m.style.display='flex';m.onclick=e=>{const b=e.target.closest('[data-m]');if(!b&&e.target!==m)return;m.style.display='none';if(b&&b.dataset.m==='ok')onOk()}}

/* ===== estado derivado ===== */
const parts=id=>(S.turb[id]&&S.turb[id].parts)||{};
function pState(id,k){const p=parts(id)[k];if(!p||!p.inicio)return 'none';return p.fin?'ok':'curso'}
const reqOk=(id,k)=>PK[k].req.every(r=>pState(id,r)==='ok');
function prog(id){let ok=0,cur=0;MECH.forEach(p=>{const s=pState(id,p.k);if(s==='ok')ok++;else if(s==='curso')cur++});return{ok,cur,pct:Math.round(ok/NM*100),ener:pState(id,'ener')==='ok',run:pState(id,'run')==='ok'}}
const actAlarms=()=>Object.values(S.alarms).filter(a=>!a.fin).sort((a,b)=>a.inicio<b.inicio?-1:1);
const tAlarms=id=>actAlarms().filter(a=>a.turb===id||a.turb==='PARQUE');
const tName=id=>id==='PARQUE'?'Todo el parque':((S.cfg&&S.cfg.turbs.find(t=>t.id===id))||{name:id}).name;
const aDur=a=>(a.fin?new Date(a.fin):new Date())-new Date(a.inicio);
const cc=i=>(S.cfg&&S.cfg.circs[i]&&S.cfg.circs[i].color)||CCOL[i%CCOL.length];
const LTYPES=[['solid','Continua'],['dash','Guiones'],['dot','Puntos'],['dashdot','Guion-punto'],['at','Alta tensión (torres)'],['double','Doble línea']];
function cNodes(i){const c=S.cfg;return [{id:'SET',x:c.set.x,y:c.set.y},...c.turbs.filter(t=>t.circ===i)]}
function cPath(i){const n=cNodes(i),r=(S.cfg.circs[i].route)||{};const pts=[];const wps=[];
  n.forEach((a,j)=>{pts.push(a);if(j<n.length-1){const key=a.id+'>'+n[j+1].id;(r[key]||[]).forEach(p=>{pts.push(p);wps.push(p)})}});return{pts,wps}}
const cName=i=>(S.cfg.circs[i]&&S.cfg.circs[i].name)||('Circuito '+(i+1));

/* ===== persistencia: varios parques, base compartida (db) o local ===== */
const PP=()=>'parques/'+UI.pid;
function bindCfg(){const p=S.parks[UI.pid];S.cfg=p?p.cfg:null;S.info=p?p.info:null;if(S.info){try{localStorage.setItem('wtg-pinfo',JSON.stringify(S.info))}catch(e){}}}
const LSK='wtg-montaje-v2';
function lsAll(){try{const v=JSON.parse(localStorage.getItem(LSK)||'null');if(v)return v}catch(e){}return{parks:{},data:{}}}
function lsSave(){const a=lsAll();a.parks=S.parks;if(UI.pid)a.data[UI.pid]={turb:S.turb,alarms:S.alarms};try{localStorage.setItem(LSK,JSON.stringify(a))}catch(e){toast('No hay espacio en este navegador para guardar')}}
function lsLoad(){const a=lsAll();
  try{const o=JSON.parse(localStorage.getItem('wtg-montaje-v1')||'null');if(o&&o.cfg&&!Object.keys(a.parks).length){const pid='p'+Date.now().toString(36);a.parks[pid]={info:{nombre:'Mi parque',n:o.cfg.turbs.length,circs:o.cfg.circs.length,modelo:'',potencia:0,creado:nowI()},cfg:o.cfg};a.data[pid]={turb:o.turb||{},alarms:o.alarms||{}};UI.pid=pid;localStorage.setItem(LSK,JSON.stringify(a))}}catch(e){}
  S.parks=a.parks||{};if(!S.parks[UI.pid])UI.pid=Object.keys(S.parks)[0]||null;S.loaded=true;bindCfg();subPark()}
const Q={};
function serial(key,fn){const p=(Q[key]||Promise.resolve()).then(fn).catch(errH);Q[key]=p;return p}
function errH(e){const c=e&&e.code;if(c==='invalid_argument')toast('No se pudo guardar: Firebase rechazó el permiso (revisá las reglas).');else if(c==='quota_exceeded')toast('Base de datos llena: '+(e.message||''));else if(c==='unavailable')toast('Sin conexión, el cambio no se guardó. Reintentá.');else toast('Error al guardar: '+((e&&e.message)||e))}
let cfgT=null;
function writePark(){const pid=UI.pid,d=clone({info:S.info,cfg:S.cfg});return serial('cfg'+pid,()=>db.doc('parques/'+pid).set(d)).finally(()=>{cfgDirty=false})}
function saveCfg(now){if(!UI.pid)return;S.parks[UI.pid]={info:S.info,cfg:S.cfg};render();if(MODE!=='db'){lsSave();return}cfgDirty=true;clearTimeout(cfgT);cfgT=setTimeout(writePark,now?0:500)}
function saveTurb(id){render();if(MODE!=='db'){lsSave();return}const d={parts:clone(parts(id))},pp=PP();serial('t'+id,()=>db.doc(pp+'/turbinas/'+id).set(d))}
function saveAlarm(a){S.alarms[a.id]=a;render();if(MODE!=='db'){lsSave();return}const d=clone(a),pp=PP();serial('a'+a.id,()=>db.doc(pp+'/alarmas/'+a.id).set(d))}
function delAlarm(id){delete S.alarms[id];render();if(MODE!=='db'){lsSave();return}const pp=PP();serial('a'+id,()=>db.doc(pp+'/alarmas/'+id).delete())}
function setPart(id,k,val){const t=S.turb[id]?clone(S.turb[id]):{parts:{}};t.parts=t.parts||{};if(val)t.parts[k]=val;else delete t.parts[k];S.turb[id]=t;saveTurb(id)}
let unT=null,unA=null;
function subPark(){if(unT)unT();if(unA)unA();unT=unA=null;S.turb={};S.alarms={};S.subPid=UI.pid;if(!UI.pid)return;
  if(MODE!=='db'){const d=lsAll().data[UI.pid]||{};S.turb=d.turb||{};S.alarms=d.alarms||{};return}
  const pp=PP(),pid=UI.pid;
  unT=db.collection(pp+'/turbinas').onSnapshot(q=>{if(S.subPid!==pid)return;const t={};q.docs.forEach(d=>t[d.id]=clone(d.data()));S.turb=t;render()},permErr);
  unA=db.collection(pp+'/alarmas').onSnapshot(q=>{if(S.subPid!==pid)return;const a={};q.docs.forEach(d=>a[d.id]=clone(d.data()));S.alarms=a;render()},permErr)}
function permErr(e){NOTE=e&&e.code==='invalid_argument'?'Firebase rechazó el acceso. Hay que actualizar las reglas de Firestore (permiso para las colecciones montaje_*).':'Error de base de datos: '+((e&&e.message)||e);render()}
function selectPark(pid){if(pid===UI.pid)return;UI.pid=pid;try{localStorage.setItem('wtg-pid',pid)}catch(e){}UI.sel=null;UI.ov=false;UI.le=false;bindCfg();subPark();render();setTimeout(fitAll,50)}
function newPid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function migrate(){if(migrate.on)return;migrate.on=true;
  const un=db.doc('parque/config').onSnapshot(s=>{if(s.metadata.fromCache&&!s.exists)return;un();if(!s.exists)return;
    const old=clone(s.data()),pid=newPid(),info={nombre:'Mi parque',n:old.turbs.length,circs:old.circs.length,modelo:'',potencia:0,creado:nowI()};
    db.doc('parques/'+pid).set({info,cfg:old});
    const ut=db.collection('turbinas').onSnapshot(q=>{if(q.metadata.fromCache)return;ut();q.docs.forEach(d=>db.doc('parques/'+pid+'/turbinas/'+d.id).set(clone(d.data())))},()=>{});
    const ua=db.collection('alarmas').onSnapshot(q=>{if(q.metadata.fromCache)return;ua();q.docs.forEach(d=>db.doc('parques/'+pid+'/alarmas/'+d.id).set(clone(d.data())))},()=>{});
    UI.pid=pid;try{localStorage.setItem('wtg-pid',pid)}catch(e){}UI.cfgOpen=true;
    toast('Pasé tus datos anteriores a un parque nuevo. Completá su nombre, modelo y potencia.')},()=>{})}

/* ===== respaldos ===== */
function bkData(){return{v:2,fecha:nowI(),pid:UI.pid,info:clone(S.info),cfg:clone(S.cfg),turb:clone(S.turb),alarms:clone(S.alarms)}}
function slug(t){return String(t||'parque').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()}
function download(name,text){try{const u=URL.createObjectURL(new Blob([text],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true}catch(e){return false}}
async function doBackup(){if(!S.cfg)return;const d=bkData(),txt=JSON.stringify(d),f=d.fecha;
  const fn=`respaldo-${slug(S.info&&S.info.nombre)}-${f.slice(0,16).replace(/[:T]/g,'-')}.json`;download(fn,txt);
  if(MODE==='db'){await serial('bk',()=>db.doc('respaldos/b'+Date.now().toString(36)).set({pid:UI.pid,nombre:(S.info&&S.info.nombre)||'',fecha:f,data:txt}))}
  else{const a=lsAll();a.bk=(a.bk||[]).concat([{pid:UI.pid,nombre:S.info.nombre,fecha:f,data:txt}]).slice(-10);try{localStorage.setItem(LSK,JSON.stringify(a))}catch(e){}}
  S.info.lastBk=f;saveCfg(true);toast('Respaldo creado ✔ (archivo descargado'+(MODE==='db'?' + copia en la nube)':')'))}
function loadBackups(){S.bk=null;render();
  if(MODE!=='db'){S.bk=(lsAll().bk||[]).filter(b=>b.pid===UI.pid).map((b,i)=>({id:'l'+i,...b})).reverse();render();return}
  const un=db.collection('respaldos').onSnapshot(q=>{if(q.metadata.fromCache&&q.empty)return;un();S.bk=q.docs.map(d=>({id:d.id,...d.data()})).filter(b=>b.pid===UI.pid).sort((a,b)=>a.fecha<b.fecha?1:-1).slice(0,20);render()},e=>{S.bk=[];permErr(e)})}
function restoreData(d){if(!d||!d.cfg){toast('El archivo no es un respaldo válido');return}
  const keepBk=S.info&&S.info.lastBk;S.info={...(d.info||S.info),lastBk:keepBk};S.cfg=d.cfg;S.parks[UI.pid]={info:S.info,cfg:S.cfg};
  const nt=d.turb||{},na=d.alarms||{};
  if(MODE==='db'){const pp=PP();writePark();
    Object.keys(S.turb).forEach(id=>{if(!nt[id])serial('t'+id,()=>db.doc(pp+'/turbinas/'+id).delete())});
    Object.keys(nt).forEach(id=>{const v=clone(nt[id]);serial('t'+id,()=>db.doc(pp+'/turbinas/'+id).set(v))});
    Object.keys(S.alarms).forEach(id=>{if(!na[id])serial('a'+id,()=>db.doc(pp+'/alarmas/'+id).delete())});
    Object.keys(na).forEach(id=>{const v=clone(na[id]);serial('a'+id,()=>db.doc(pp+'/alarmas/'+id).set(v))})}
  S.turb=clone(nt);S.alarms=clone(na);if(MODE!=='db')lsSave();render();toast('Respaldo restaurado ✔')}
const needBk=()=>S.info&&S.cfg&&(Object.keys(S.turb).length||S.cfg.locked)&&(!S.info.lastBk||Date.now()-new Date(S.info.lastBk)>864e5);

function openOv(id){const was=UI.ov&&UI.sel===id;UI.sel=id;UI.ov=true;render();const o=document.querySelector('#ov .ovscroll');if(o&&!was)o.scrollTop=0}
async function flushSaves(){clearTimeout(cfgT);if(MODE==='db'&&cfgDirty)writePark();
  let ok=true;try{await Promise.all(Object.values(Q).map(p=>p.then(()=>{},()=>{ok=false})))}catch(e){ok=false}return ok}
async function init(){
  document.body.insertAdjacentHTML('afterbegin',`<svg width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"><defs>${DEFS}</defs></svg>`);
  render();
  let c=null;try{c=await Promise.race([window.FB_READY||Promise.resolve(null),new Promise(r=>setTimeout(()=>r(null),9000))])}catch(e){c=null}
  if(!c){MODE='local';lsLoad();render();return}
  db=c;MODE='db';
  const tm=setTimeout(()=>{NOTE='Todavía no se pudo leer la base de datos. Revisá la conexión; los datos pueden no estar actualizados.';render()},10000);
  db.collection('parques').onSnapshot(q=>{
    if(!q.metadata.fromCache){clearTimeout(tm);if(NOTE.startsWith('Todavía')||NOTE.startsWith('Firebase'))NOTE=''}
    const ps={};q.docs.forEach(d=>ps[d.id]=clone(d.data()));
    if(cfgDirty&&S.parks[UI.pid])ps[UI.pid]=S.parks[UI.pid];
    S.parks=ps;if(!q.metadata.fromCache)S.loaded=true;
    if(!q.metadata.fromCache&&q.empty)migrate();
    if(UI.pid&&!S.parks[UI.pid]&&S.loaded&&!migrate.on)UI.pid=null;
    if(!UI.pid&&Object.keys(S.parks).length){UI.pid=Object.keys(S.parks).sort((a,b)=>((S.parks[a].info||{}).creado||'')<((S.parks[b].info||{}).creado||'')?-1:1)[0];try{localStorage.setItem('wtg-pid',UI.pid)}catch(e){}}
    bindCfg();if(S.subPid!==UI.pid&&S.parks[UI.pid])subPark();
    if(S.cfg&&!S.fitted){S.fitted=true;setTimeout(fitAll,60)}
    render()},e=>{clearTimeout(tm);S.loaded=true;permErr(e)});
}

/* ===== configuración del parque ===== */
function autoLayout(c){
  const nC=c.circs.length;c.set=c.set||{x:70,y:350};
  for(let ci=0;ci<nC;ci++){
    const ts=c.turbs.filter(t=>t.circ===ci);const y=nC===1?420:Math.round(170+ci*(460/(nC-1)));
    ts.forEach((t,j)=>{t.x=Math.round(190+j*(720/Math.max(1,ts.length-1||1)));if(ts.length===1)t.x=400;t.y=y});
  }
}
function newCfg(nT,nC){
  const c={turbs:[],circs:[],set:{x:70,y:350},locked:false,nextId:1};
  for(let i=0;i<nC;i++)c.circs.push({name:'Circuito '+(i+1)});
  for(let i=0;i<nT;i++){c.turbs.push({id:'w'+c.nextId++,name:'WTG'+pad(i+1),circ:Math.min(nC-1,Math.floor(i*nC/nT)),x:0,y:0})}
  autoLayout(c);return c;
}
function applyCounts(nT,nC){
  const c=S.cfg;
  while(c.circs.length<nC)c.circs.push({name:'Circuito '+(c.circs.length+1)});
  c.circs.length=nC;
  c.turbs.forEach(t=>{if(t.circ>=nC)t.circ=nC-1});
  while(c.turbs.length<nT){const ci=nC-1;const last=c.turbs.filter(t=>t.circ===ci).slice(-1)[0];c.turbs.push({id:'w'+c.nextId++,name:'WTG'+pad(c.turbs.length+1),circ:ci,x:Math.min(940,last?last.x+90:400),y:last?last.y:350})}
  c.turbs.length=nT;
  if(!c.turbs.find(t=>t.id===UI.sel))UI.sel=null;
  if(S.info){S.info.n=nT;S.info.circs=nC}
  saveCfg(true);
}

  DRAW.forEach(k=>{const p=PK[k];const st=pState(id,k);const av=reqOk(id,k);
    const cls=st==='none'?(av?'avail':'lock'):st;
    let g=(st!=='none'||k==='base'||p.x)?{s:air(k)}:ground(k);
    if(k==='rad'&&st!=='none'&&nacOnGround)g={s:`<g transform="translate(${GOFF.nacelle[0]},${GOFF.nacelle[1]})">${air('rad')}</g>`};
    out[k]=`<g class="p ${cls} ${k==='base'&&st==='none'?'base-none':''}" data-part="${k}" style="--c:${p.c}">${g.s}${g.l?`<text class="glbl" x="${g.l[0]}" y="${g.l[1]}" text-anchor="${['pa','pb','pc'].includes(k)?'start':'middle'}">${p.n}</text>`:''}${k==='base'&&st==='none'?`<text class="glbl" x="230" y="440" text-anchor="middle">Base pendiente</text>`:''}</g>`});
  const spin=pState(id,'run')==='ok';

  return s+'</svg>';
}

function csv(){
  const L=[['Turbina','Circuito','Pieza','Inicio','Fin','Duracion_min'].join(';')];
  S.cfg.turbs.forEach(t=>PARTS.forEach(p=>{const v=parts(t.id)[p.k]||{};L.push([t.name,cName(t.circ),p.n,v.inicio?fmt(v.inicio):'',v.fin?fmt(v.fin):'',v.inicio&&v.fin?Math.round((new Date(v.fin)-new Date(v.inicio))/60000):''].join(';'))}));
  L.push('');L.push(['Alarma_turbina','Motivo','Detalle','Supervisor','Inicio','Fin','Perdido_min'].join(';'));
  Object.values(S.alarms).forEach(a=>L.push([tName(a.turb),a.motivo,(a.detalle||'').replace(/;/g,','),a.sup,fmt(a.inicio),a.fin?fmt(a.fin):'ACTIVA',Math.round(aDur(a)/60000)].join(';')));

}

/* ===== acciones ===== */
function partClick(id,k){
  const st=pState(id,k);
  if(st==='none'&&PK[k].x){if(!reqOk(id,k)){toast(k==='ener'?'Para energizar, la turbina tiene que estar 100% montada':'Primero hay que energizar');return}
    const n=nowI();setPart(id,k,{inicio:n,fin:n});toast(k==='ener'?'⚡ '+tName(id)+' energizada':'▶ '+tName(id)+' en RUN');return}
  if(st==='none'){if(!reqOk(id,k)){toast('Primero hay que montar: '+PK[k].req.filter(r=>pState(id,r)!=='ok').map(r=>PK[r].n).join(', '));return}
    setPart(id,k,{inicio:nowI(),fin:null});toast(PK[k].n+': inicio de izaje registrado')}
  else if(st==='curso'){setPart(id,k,{...parts(id)[k],fin:nowI()});toast(PK[k].n+' montada ✔')}
  else{const v=parts(id)[k];toast(`${PK[k].n}: ${fmt(v.inicio)} → ${fmt(v.fin)}`)}
}
function startAlarm(target){
  const d=UI.draft;const sup=(d.sup||'').trim();if(!sup){toast('Ingresá el nombre del supervisor');return}
  try{localStorage.setItem('wtg-sup',sup)}catch(e){}
  const a={id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),turb:target,motivo:d.motivo||MOTIVOS[0],detalle:(d.detalle||'').trim(),sup,inicio:nowI(),fin:null};
  d.detalle='';saveAlarm(a);
}
document.addEventListener('click',e=>{
  const pg=e.target.closest('#tsvg [data-part]');if(pg){partClick(UI.sel,pg.dataset.part);return}
  const b=e.target.closest('[data-act]');if(!b)return;const v=b.dataset.v,c=S.cfg;
  switch(b.dataset.act){
   case 'tab':UI.tab=v;render();break;
   case 'theme':window.toggleTheme();break;
   case 'goAlarm':if(v==='PARQUE'){UI.ov=false;UI.tab='alarmas';render()}else openOv(v);break;
   case 'create':{const i=readPark('s');if(i)createPark(i);break}
   case 'newpark':UI.cfgOpen=false;render();modal(`<h2>➕ Nuevo parque</h2>${parkForm('m')}`,()=>{const i=readPark('m');if(i)createPark(i)},'Crear parque');break;
   case 'cfg':UI.cfgOpen=true;S.bk=undefined;render();break;
   case 'cfgclose':UI.cfgOpen=false;flushSaves().then(ok=>{render();toast(ok?'Configuración guardada ✔':'Revisá: hubo un error al guardar')});break;
   case 'bk':doBackup();break;
   case 'bklist':loadBackups();break;
   case 'bkrest':{const b2=(S.bk||[]).find(x=>x.id===v);if(!b2)break;modal(`<p>¿Restaurar el respaldo del <b>${fmt(b2.fecha)}</b>? Reemplaza la configuración, los registros de montaje y las alarmas actuales de este parque.</p>`,()=>{try{restoreData(JSON.parse(b2.data))}catch(x){toast('Respaldo dañado')}},'Restaurar',true);break}
   case 'logout':modal('<p>¿Cerrar sesión en este dispositivo?</p>',()=>{try{localStorage.removeItem('wtg-auth')}catch(x){}location.reload()},'Cerrar sesión');break;
   case 'delpark':modal(`<p>¿Eliminar el parque <b>${esc((S.info||{}).nombre)}</b> de la lista?</p><p class="mut" style="font-size:12px">Antes se descarga un respaldo automático por las dudas.</p>`,async()=>{await doBackup();const pid=UI.pid;delete S.parks[pid];UI.cfgOpen=false;
       if(MODE==='db')serial('del',()=>db.doc('parques/'+pid).delete());else lsSave();UI.pid=null;S.subPid=null;const nx=Object.keys(S.parks)[0];if(nx)selectPark(nx);else{bindCfg();subPark();render()}},'Eliminar',true);break;
   case 'full':{const id=UI.sel,nowL=toInp(nowI());const falt=MECH.filter(x=>pState(id,x.k)!=='ok');
     modal(`<h2>✅ Montada completa · ${esc(tName(id))}</h2><p>Se van a registrar como montadas las <b>${falt.length}</b> piezas que faltan: ${falt.map(x=>x.n).join(', ')}.</p>
      <div class="pform"><label>Inicio<input type="datetime-local" id="fullI" value="${nowL}"></label><label>Fin<input type="datetime-local" id="fullF" value="${nowL}"></label></div>
      <p class="mut" style="font-size:12px">Las piezas que ya se estaban izando conservan su hora de inicio. Si algo quedó mal, se corrige pieza por pieza en la tabla.</p>`,()=>{
      const fi=fromInp($('#fullI').value)||nowI(),ff=fromInp($('#fullF').value)||nowI();if(ff<fi){toast('El fin no puede ser anterior al inicio');return}
      const t=S.turb[id]?clone(S.turb[id]):{parts:{}};t.parts=t.parts||{};
      MECH.forEach(x=>{const v=t.parts[x.k];if(v&&v.inicio&&v.fin)return;t.parts[x.k]=v&&v.inicio?{...v,fin:ff<v.inicio?v.inicio:ff}:{inicio:fi,fin:ff}});
      S.turb[id]=t;saveTurb(id);toast(tName(id)+' registrada como montada completa ✔')},'Marcar completa');break}
   case 'tsz':setTs(UI.ts*(+v));break;
   case 'lock':c.locked=!c.locked;saveCfg(true);break;
   case 'mm':UI.moveMode=v;render();break;
   case 'zoom':zoomAt(+v);break;
   case 'zreset':fitAll();break;
   case 'msz':setMs(UI.ms*(+v));break;
   case 'le':UI.le=true;UI.ec=UI.ec||0;UI.selV=null;render();break;
   case 'lsave':UI.le=false;UI.selV=null;flushSaves().then(ok=>{render();toast(ok?'Líneas guardadas ✔':'Error al guardar las líneas')});break;
   case 'vdel':{const ci=c.circs[UI.ec];if(UI.selV&&ci.route&&ci.route[UI.selV.seg]){ci.route[UI.selV.seg].splice(UI.selV.i,1);UI.selV=null;saveCfg(true)}break}
   case 'rreset':modal(`<p>¿Dejar recto el recorrido de <b>${esc(cName(UI.ec))}</b>? Se borran todos sus vértices.</p>`,()=>{c.circs[UI.ec].route={};UI.selV=null;saveCfg(true)},'Dejar recto',true);break;
   case 'filt':UI.f[v]=!UI.f[v];try{localStorage.setItem('wtg-f',JSON.stringify(UI.f))}catch(_){};render();break;
   case 'ident':UI.ident=!UI.ident;try{localStorage.setItem('wtg-ident',UI.ident?'1':'0')}catch(_){};render();break;
   case 'savelock':c.locked=true;saveCfg(true);flushSaves().then(ok=>toast(ok?'Posiciones guardadas y bloqueadas 🔒':'Bloqueado, pero hubo un error al guardar'));break;
   case 'ovclose':flushSaves().then(ok=>{UI.ov=false;render();toast(ok?'Montaje guardado ✔':'Revisá: hubo un error al guardar')});break;
   case 'ovnav':{const i=c.turbs.findIndex(t=>t.id===UI.sel)+(+v);if(c.turbs[i])openOv(c.turbs[i].id);break}
   case 'nav':{const i=c.turbs.findIndex(t=>t.id===UI.sel)+(+v);if(c.turbs[i]){UI.sel=c.turbs[i].id;render()}break}
   case 'openT':e.preventDefault();openOv(v);break;
   case 'pstart':case 'pend':partClick(UI.sel,v);break;
   case 'preset':modal(`<h2>${PK[v].n}</h2><p>¿Borrar el registro de esta pieza en ${esc(tName(UI.sel))}? La pieza vuelve al acopio.</p>`,()=>{
       const dep=PARTS.filter(p=>p.req.includes(v)&&pState(UI.sel,p.k)!=='none');if(dep.length){toast('Primero desmontá: '+dep.map(p=>p.n).join(', '));return}setPart(UI.sel,v,null)},'Borrar',true);break;
   case 'aon':startAlarm(v);break;
   case 'aon2':startAlarm(UI.draft.target||'PARQUE');break;
   case 'aend':{const a=S.alarms[v];if(a)saveAlarm({...a,fin:nowI()});break}
   case 'adel':modal('<p>¿Eliminar esta alarma del historial?</p>',()=>delAlarm(v),'Eliminar',true);break;
   case 'csv':{const t=csv();navigator.clipboard.writeText(t).then(()=>toast('CSV copiado. Pegalo en Excel o Sheets.'),()=>{modal(`<h2>CSV</h2><textarea style="width:100%;height:220px;background:var(--bg);color:var(--tx)">${esc(t)}</textarea>`,()=>{},'Cerrar')});break}
   case 'apply':{const nT=Math.max(1,Math.min(200,+$('#cT').value||1)),nC=Math.max(1,Math.min(20,+$('#cC').value||1));
     if(nT<c.turbs.length||nC<c.circs.length)modal(`<p>Vas a reducir el parque a <b>${nT}</b> turbinas y <b>${nC}</b> circuitos. Se quitan las últimas de la lista.</p>`,()=>applyCounts(nT,nC),'Aplicar');else applyCounts(nT,nC);break}
   case 'relayout':autoLayout(c);saveCfg(true);toast('Posiciones reordenadas por circuito');break;
   case 'up':case 'down':{const i=+v,j=b.dataset.act==='up'?i-1:i+1;[c.turbs[i],c.turbs[j]]=[c.turbs[j],c.turbs[i]];saveCfg();break}
   case 'wipe':modal('<p><b>Se borran todos los registros de montaje y todas las alarmas.</b> La configuración y las posiciones se mantienen. No se puede deshacer.</p>',()=>{
       Object.keys(S.turb).forEach(id=>{S.turb[id]={parts:{}};saveTurb(id)});Object.keys(S.alarms).forEach(delAlarm);toast('Registros borrados')},'Borrar todo',true);break;
  }
});
document.addEventListener('input',e=>{if(e.target.dataset.cst){const ci=S.cfg.circs[UI.ec],f=e.target.dataset.cst;ci[f]=f==='w'?+e.target.value:e.target.value;if(f==='name'&&!ci.name.trim())ci.name='Circuito '+(UI.ec+1);const w=document.getElementById('cwv');if(w&&f==='w')w.textContent=ci.w;const m=document.getElementById('map');if(m)m.innerHTML=mapSvg();return}if(e.target.id==='msr'){setMs(+e.target.value);return}if(e.target.id==='tsr'){setTs(+e.target.value);return}const d=e.target.dataset.draft;if(d)UI.draft[d]=e.target.value});
document.addEventListener('change',e=>{
  const el=e.target,c=S.cfg;
  if(el.dataset.draft){UI.draft[el.dataset.draft]=el.value;return}
  if(el.dataset.cst){saveCfg();return}
  if(el.id==='bkfile'&&el.files&&el.files[0]){const f=el.files[0];f.text().then(t=>{let d;try{d=JSON.parse(t)}catch(x){toast('Archivo inválido');return}
     modal(`<p>¿Restaurar el respaldo <b>${esc(f.name)}</b>${d.fecha?' del '+fmt(d.fecha):''}? Reemplaza los datos actuales de este parque.</p>`,()=>restoreData(d),'Restaurar',true)});el.value='';return}
  if(el.dataset.inf){const f=el.dataset.inf;S.info[f]=f==='potencia'?Math.max(0,+String(el.value).replace(',','.')||0):el.value.trim();if(f==='nombre'&&!S.info.nombre)S.info.nombre='Parque';S.info.n=S.cfg.turbs.length;S.info.circs=S.cfg.circs.length;saveCfg();return}
  if(el.dataset.act2==='park'){if(el.value==='__new'){el.value=UI.pid;modal(`<h2>➕ Nuevo parque</h2>${parkForm('m')}`,()=>{const i=readPark('m');if(i)createPark(i)},'Crear parque')}else selectPark(el.value);return}
  if(el.dataset.act2==='ec'){UI.ec=+el.value;UI.selV=null;render();return}
  if(el.dataset.act2==='selT'){UI.sel=el.value;render();return}
  if(el.dataset.ed){const k=el.dataset.v,f=el.dataset.ed,cur={...(parts(UI.sel)[k]||{})};const val=fromInp(el.value);
    if(f==='inicio'&&!val){toast('El inicio no puede quedar vacío');render();return}
    cur[f]=val;if(cur.fin&&cur.inicio&&cur.fin<cur.inicio){toast('El fin no puede ser anterior al inicio');render();return}
    if(f==='fin'&&val&&!reqOk(UI.sel,k)){toast('Faltan piezas previas');render();return}
    setPart(UI.sel,k,cur);return}
  if(el.dataset.aed){const a={...S.alarms[el.dataset.v]};const val=fromInp(el.value);if(!val){render();return}a[el.dataset.aed]=val;if(a.fin&&a.fin<a.inicio){toast('El fin no puede ser anterior al inicio');render();return}saveAlarm(a);return}
  if(el.dataset.cname!=null){c.circs[+el.dataset.cname].name=el.value.trim()||('Circuito '+(+el.dataset.cname+1));saveCfg();return}
  if(el.dataset.ted){const t=c.turbs.find(x=>x.id===el.dataset.v);const f=el.dataset.ted;
    if(f==='name')t.name=el.value.trim()||t.name;else if(f==='circ')t.circ=+el.value;else{const n=Math.round(+el.value);t[f]=isNaN(n)?t[f]:n}
    saveCfg();return}
});
setInterval(()=>{document.querySelectorAll('[data-since]').forEach(el=>el.textContent=durS(Date.now()-new Date(el.dataset.since)))},1000);
init();
</script>
</body>
</html>
