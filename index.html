<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Montaje de aerogeneradores</title>
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script>window.FB_READY=new Promise(r=>{window.__fbResolve=r});</script>
<script type="module" src="/db-firebase.js"></script>
<style>
:root{--bg:#0e1217;--card:#181e26;--card2:#202833;--line:#2c3542;--tx:#e8edf3;--mut:#93a0b0;--ok:#2ecc71;--cur:#ffc400;--bad:#ff3b3b;--acc:#3fa9f5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}
button{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{filter:brightness(1.15)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.ok{background:#1f7a45;border-color:#2ecc71}
button.warn{background:#7a5b00;border-color:var(--cur)}
button.danger{background:#7a1010;border-color:var(--bad)}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button.sm{padding:3px 8px;font-size:12px}
input,select{background:#0b0f14;border:1px solid var(--line);border-radius:7px;padding:6px 8px}
input[type=number]{width:80px}
header{position:sticky;top:0;z-index:20;background:#0b0f14ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap}
.top h1{font-size:16px;margin:0;flex:1;white-space:nowrap}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.tabs{display:flex;gap:4px;padding:0 8px 8px;overflow-x:auto}
.tabs button{border-radius:20px;white-space:nowrap}
main{padding:12px;max-width:1150px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mut{color:var(--mut)}
.grow{flex:1}
h2{font-size:15px;margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--mut);font-weight:600;font-size:12px}
.tw{overflow-x:auto}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chip{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.chip.none{background:#2a313b;color:var(--mut)}
.chip.curso{background:#4d3b00;color:var(--cur)}
.chip.ok{background:#11432a;color:var(--ok)}
.bar{height:8px;background:#0b0f14;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2ecc71,#7ee08f)}
#banner{position:sticky;top:0;z-index:30}
.alarmb{animation:flash 1s infinite;color:#fff;padding:10px 14px;font-weight:700;display:flex;gap:10px;align-items:center;cursor:pointer;border-bottom:2px solid #fff3;font-size:15px}
@keyframes flash{0%,100%{background:#e00020}50%{background:#5c000c}}
.alarmbox{border:3px solid var(--bad);border-radius:12px;padding:14px;animation:flash 1s infinite;color:#fff}
.alarmbox .big{font-size:22px;font-weight:800}
.timer{font-variant-numeric:tabular-nums;font-size:26px;font-weight:800}
.bigbtn{font-size:18px;font-weight:800;padding:14px 18px;width:100%;background:#b0001a;border:2px solid #ff6b6b;color:#fff;border-radius:12px;letter-spacing:.5px}
.mapwrap{background:#0b1015;border:1px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none}
svg.map{width:100%;height:auto;display:block;user-select:none}
svg.map .tn{cursor:pointer}
svg.map.unlocked .tn{cursor:grab}
.tn.alarm .ring{animation:ringf 1s infinite}
@keyframes ringf{0%,100%{stroke:#ff2020;stroke-width:9}50%{stroke:#ff202000;stroke-width:3}}
.tsvgw{display:flex;justify-content:center}
svg.tsvg{width:100%;max-width:520px;height:auto;max-height:72vh;user-select:none}
.sh{stroke:#0000004d;stroke-width:.6}
.m-tw{fill:url(#gTw)}.m-twh{fill:url(#gTwH)}.m-fl{fill:#aeb5bc}.m-nac{fill:url(#gNac)}.m-nact{fill:url(#gNacT)}.m-win{fill:#2b3b4b}
.m-rad{fill:url(#gRad)}.m-pt{fill:url(#gPT)}.m-hub{fill:url(#gHub)}.m-hubr{fill:#b9c0c6}.m-bl{fill:url(#gBl)}
.m-base{fill:url(#gBase)}.m-baset{fill:#9d9a92}.m-gravel{fill:#4a4234}
.fl{stroke:#00000066;stroke-width:1}.dr{fill:#b9c0c6;stroke:#0006;stroke-width:.6}.seam{stroke:#0000002e;stroke-width:.8}.fin{stroke:#5d656d;stroke-width:1;fill:none}
.gsh{fill:#000;opacity:.4}
@keyframes pul{0%,100%{stroke-opacity:1}50%{stroke-opacity:.2}}
.p{cursor:pointer}
.p.curso{filter:drop-shadow(0 0 5px #ffd400)}
.p.curso .sh{stroke:#ffd400;stroke-width:2;animation:pul 1s infinite}
.p.avail .sh{stroke:#4fc3f7;stroke-width:1.4;stroke-dasharray:5 3}
.p.avail:hover{filter:brightness(1.12) drop-shadow(0 0 4px #4fc3f7)}
.p.lock{opacity:.45;cursor:not-allowed}
.p.base-none .sh{fill:#ffffff0d!important;stroke:#4fc3f7;stroke-dasharray:5 4}
.ident .sh{fill:var(--c)!important}
.p .hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke}
.glbl{font-size:9px;fill:#efe6d2;paint-order:stroke;stroke:#000b;stroke-width:2.5px}
.mt{paint-order:stroke;stroke:#0b1015;stroke-width:4px;stroke-linejoin:round}
.lbl{font-size:11px;fill:#c9b48a;font-weight:700;letter-spacing:1px}
#toast{pointer-events:none;position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000d;border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:50;display:none;max-width:90vw}
#modal{position:fixed;inset:0;background:#000a;z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
#modal .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:420px;width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.legend span{margin-right:12px;white-space:nowrap}
.kpi{display:flex;gap:10px;flex-wrap:wrap}
.kpi div{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:110px}
.kpi b{display:block;font-size:20px}
input.dt{width:170px;font-size:12px;padding:4px 6px}
.mp .sh,.mp .fl,.mp .seam{pointer-events:none}
.mp.curso{filter:drop-shadow(0 0 8px #ffd400)}
.mp.curso .sh{stroke:#ffd400;stroke-width:3;animation:pul 1s infinite}
.mp.none{opacity:.16}
.mp .hit{display:none}
.hitb{fill:#ffffff01;stroke:none}
.hnd{cursor:move}
[data-cl]{cursor:pointer}
.tn.alarm .hitb{animation:ringf 1s infinite}
.card-t{fill:#0d141c;stroke-width:4}
.tn.alarm .card-t{animation:ringf 1s infinite}
.tn.done .card-t{fill:#0f2a1c}
#ov{position:fixed;z-index:45;background:#121821f7;border:1px solid #3a4656;border-radius:14px;box-shadow:0 18px 50px #000c;display:flex;flex-direction:column;overflow:hidden;resize:both;min-width:300px;min-height:160px;container-type:inline-size;backdrop-filter:blur(4px)}
#ov.min{height:auto!important;resize:none}
#ov.min .ovscroll{display:none}
#ov .ovbar{background:#0b0f14;border-bottom:1px solid var(--line);padding:8px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;cursor:move;touch-action:none;user-select:none}
#ov .ovbar .grip{color:var(--mut);font-size:16px;letter-spacing:-2px}
#ov .ovscroll{flex:1;overflow:auto}
#ov .ovbody{padding:10px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
#ov .ovbody>div{min-width:0}
@container (min-width:860px){#ov .ovbody{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
#ov .card{margin-bottom:10px}
#ov svg.tsvg{max-width:none;max-height:70vh}
.sumg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px}
.sumg .lab{display:flex;justify-content:space-between;font-size:12px}
.note{background:#2b2200;border:1px solid #6b5600;color:#ffe08a;padding:8px 12px;border-radius:8px;margin-bottom:10px}
</style>
</head>
<body>
<div id="banner"></div>
<header id="hdr"></header>
<main id="main"><div class="card">Conectando…</div></main>
<div id="modal"></div>
<div id="toast"></div>
<script>
/* ===== Definición de piezas (orden de montaje y dependencias) ===== */
const PARTS=[
 {k:'base',n:'Base',c:'#4b8cff',req:[]},
 {k:'t1',n:'T1',c:'#e62828',req:['base']},
 {k:'t2',n:'T2',c:'#ff8c00',req:['t1']},
 {k:'t3',n:'T3',c:'#f0dc00',req:['t2']},
 {k:'t4',n:'T4',c:'#28be3c',req:['t3']},
 {k:'t5',n:'T5',c:'#00bec8',req:['t4']},
 {k:'nacelle',n:'Nacelle',c:'#9646dc',req:['t5']},
 {k:'pt',n:'Power train',c:'#ff7800',req:['nacelle']},
 {k:'rad',n:'Radiador',c:'#ff5ac8',req:['nacelle']},
 {k:'hub',n:'Hub',c:'#ff3c3c',req:['pt']},
 {k:'pa',n:'Pala A',c:'#78c8ff',req:['hub']},
 {k:'pb',n:'Pala B',c:'#aaff78',req:['hub']},
 {k:'pc',n:'Pala C',c:'#ffc878',req:['hub']}
];
const PK=Object.fromEntries(PARTS.map(p=>[p.k,p]));
const DRAW=['base','t1','t2','t3','t4','t5','nacelle','rad','pt','pa','pb','pc','hub'];
const CCOL=['#3fa9f5','#f5a623','#7ed321','#c86bff','#f8e71c','#50e3c2','#ff6b6b','#b8e986','#ff9ecf','#9fb3ff'];
const MOTIVOS=['Viento','Grúa / equipo de izaje','Falta de material','Seguridad','Clima (lluvia / tormenta)','Logística / acceso','Calidad / NC','Otro'];

let db=null, MODE='loading', NOTE='', cfgDirty=false;
const S={cfg:null,turb:{},alarms:{}};
const UI={tab:'mapa',sel:null,moveMode:'turb',draft:{},ov:false,ms:.32};
UI.vb={x:0,y:0,w:1000};
const FILT=[['lines','Líneas de circuito'],['box','Recuadro'],['name','Nombre WTG'],['circ','Circuito'],['pct','% avance'],['ghost','Piezas pendientes']];
UI.le=false;UI.ec=0;UI.selV=null;
UI.f={lines:true,box:false,name:true,circ:true,pct:true,ghost:false};UI.ident=false;
try{Object.assign(UI.f,JSON.parse(localStorage.getItem('wtg-f')||'{}'));UI.ident=localStorage.getItem('wtg-ident')==='1'}catch(e){}
try{const m=+localStorage.getItem('wtg-ms');if(m>=.1&&m<=1)UI.ms=m;const v=JSON.parse(localStorage.getItem('wtg-vb')||'null');if(v&&isFinite(v.w))UI.vb=v}catch(e){}
function setMs(v){UI.ms=Math.max(.1,Math.min(1,Math.round(v*100)/100));const m=document.getElementById('map');if(m)m.innerHTML=mapSvg();const r=document.getElementById('msr');if(r)r.value=UI.ms;try{localStorage.setItem('wtg-ms',UI.ms)}catch(_){}}
try{UI.draft.sup=localStorage.getItem('wtg-sup')||''}catch(e){}

/* ===== utilidades ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowI=()=>new Date().toISOString();
const pad=n=>String(n).padStart(2,'0');
const clone=o=>JSON.parse(JSON.stringify(o));
function fmt(iso){if(!iso)return '—';return new Date(iso).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}
function dur(ms){if(ms==null||isNaN(ms)||ms<0)return '—';const m=Math.floor(ms/60000),h=Math.floor(m/60),d=Math.floor(h/24);return d?`${d}d ${h%24}h ${pad(m%60)}m`:`${h}h ${pad(m%60)}m`}
function durS(ms){const s=Math.max(0,Math.floor(ms/1000));return `${Math.floor(s/3600)}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`}
function toInp(iso){if(!iso)return '';const d=new Date(iso);return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function fromInp(v){return v?new Date(v).toISOString():null}
function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',3200)}
function modal(html,onOk,okLabel='Confirmar',danger){const m=$('#modal');m.innerHTML=`<div class="box">${html}<div class="row" style="justify-content:flex-end;margin-top:14px"><button data-m="no">Cancelar</button><button class="${danger?'danger':'pri'}" data-m="ok">${okLabel}</button></div></div>`;m.style.display='flex';m.onclick=e=>{const b=e.target.closest('[data-m]');if(!b&&e.target!==m)return;m.style.display='none';if(b&&b.dataset.m==='ok')onOk()}}

/* ===== estado derivado ===== */
const parts=id=>(S.turb[id]&&S.turb[id].parts)||{};
function pState(id,k){const p=parts(id)[k];if(!p||!p.inicio)return 'none';return p.fin?'ok':'curso'}
const reqOk=(id,k)=>PK[k].req.every(r=>pState(id,r)==='ok');
function prog(id){let ok=0,cur=0;PARTS.forEach(p=>{const s=pState(id,p.k);if(s==='ok')ok++;else if(s==='curso')cur++});return{ok,cur,pct:Math.round(ok/PARTS.length*100)}}
const actAlarms=()=>Object.values(S.alarms).filter(a=>!a.fin).sort((a,b)=>a.inicio<b.inicio?-1:1);
const tAlarms=id=>actAlarms().filter(a=>a.turb===id||a.turb==='PARQUE');
const tName=id=>id==='PARQUE'?'Todo el parque':((S.cfg&&S.cfg.turbs.find(t=>t.id===id))||{name:id}).name;
const aDur=a=>(a.fin?new Date(a.fin):new Date())-new Date(a.inicio);
const cc=i=>(S.cfg&&S.cfg.circs[i]&&S.cfg.circs[i].color)||CCOL[i%CCOL.length];
const LTYPES=[['solid','Continua'],['dash','Guiones'],['dot','Puntos'],['dashdot','Guion-punto'],['at','Alta tensión (torres)'],['double','Doble línea']];
function cNodes(i){const c=S.cfg;return [{id:'SET',x:c.set.x,y:c.set.y},...c.turbs.filter(t=>t.circ===i)]}
function cPath(i){const n=cNodes(i),r=(S.cfg.circs[i].route)||{};const pts=[];const wps=[];
  n.forEach((a,j)=>{pts.push(a);if(j<n.length-1){const key=a.id+'>'+n[j+1].id;(r[key]||[]).forEach(p=>{pts.push(p);wps.push(p)})}});return{pts,wps}}
const cName=i=>(S.cfg.circs[i]&&S.cfg.circs[i].name)||('Circuito '+(i+1));

/* ===== persistencia: base compartida (db) o local ===== */
const LSK='wtg-montaje-v1';
function lsSave(){try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}}
function lsLoad(){try{const v=JSON.parse(localStorage.getItem(LSK)||'null');if(v){S.cfg=v.cfg||null;S.turb=v.turb||{};S.alarms=v.alarms||{}}}catch(e){}}
const Q={};
function serial(key,fn){const p=(Q[key]||Promise.resolve()).then(fn).catch(errH);Q[key]=p;return p}
function errH(e){const c=e&&e.code;if(c==='invalid_argument')toast('No se pudo guardar: sin permiso de edición o dato inválido.');else if(c==='quota_exceeded')toast('Base de datos llena: '+(e.message||''));else if(c==='unavailable')toast('Sin conexión, el cambio no se guardó. Reintentá.');else toast('Error al guardar: '+((e&&e.message)||e))}
let cfgT=null;
function saveCfg(now){render();if(MODE!=='db'){lsSave();return}cfgDirty=true;clearTimeout(cfgT);cfgT=setTimeout(()=>{const d=clone(S.cfg);serial('cfg',()=>db.doc('parque/config').set(d)).finally(()=>{cfgDirty=false})},now?0:500)}
function saveTurb(id){render();if(MODE!=='db'){lsSave();return}const d={parts:clone(parts(id))};serial('t'+id,()=>db.doc('turbinas/'+id).set(d))}
function saveAlarm(a){S.alarms[a.id]=a;render();if(MODE!=='db'){lsSave();return}const d=clone(a);serial('a'+a.id,()=>db.doc('alarmas/'+a.id).set(d))}
function delAlarm(id){delete S.alarms[id];render();if(MODE!=='db'){lsSave();return}serial('a'+id,()=>db.doc('alarmas/'+id).delete())}
function setPart(id,k,val){const t=S.turb[id]?clone(S.turb[id]):{parts:{}};t.parts=t.parts||{};if(val)t.parts[k]=val;else delete t.parts[k];S.turb[id]=t;saveTurb(id)}

function openOv(id){const was=UI.ov&&UI.sel===id;UI.sel=id;UI.ov=true;UI.ovMin=false;render();const o=document.querySelector('#ov .ovscroll');if(o&&!was)o.scrollTop=0}
let wdrag=null;
document.addEventListener('pointerdown',e=>{const bar=e.target.closest('#ov .ovbar');if(!bar||e.target.closest('button,select,input'))return;
  const o=document.getElementById('ov');wdrag={sx:e.clientX,sy:e.clientY,x0:o.offsetLeft,y0:o.offsetTop,o};try{bar.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!wdrag)return;const x=wdrag.x0+e.clientX-wdrag.sx,y=Math.max(0,wdrag.y0+e.clientY-wdrag.sy);wdrag.o.style.left=x+'px';wdrag.o.style.top=y+'px';UI.ovPos.x=x;UI.ovPos.y=y});
document.addEventListener('pointerup',()=>{wdrag=null});
async function flushSaves(){clearTimeout(cfgT);if(MODE==='db'&&cfgDirty){const d=clone(S.cfg);serial('cfg',()=>db.doc('parque/config').set(d)).finally(()=>{cfgDirty=false})}
  let ok=true;try{await Promise.all(Object.values(Q).map(p=>p.then(()=>{},()=>{ok=false})))}catch(e){ok=false}return ok}
async function init(){
  render();
  let c=null;try{c=await Promise.race([window.FB_READY||Promise.resolve(null),new Promise(r=>setTimeout(()=>r(null),9000))])}catch(e){c=null}
  if(!c){MODE='local';lsLoad();render();return}
  db=c;MODE='db';
  const tm=setTimeout(()=>{NOTE='Todavía no se pudo leer la base de datos. Revisá la conexión; los datos pueden no estar actualizados.';render()},10000);
  db.doc('parque/config').onSnapshot(s=>{if(!s.metadata.fromCache){clearTimeout(tm);NOTE=''}if(cfgDirty)return;S.cfg=s.exists?clone(s.data()):null;if(!S.cfgLoaded){S.cfgLoaded=true}render()},e=>{clearTimeout(tm);NOTE='Error de base de datos: '+(e.message||e.code);render()});
  db.collection('turbinas').onSnapshot(q=>{const t={};q.docs.forEach(d=>t[d.id]=clone(d.data()));S.turb=t;render()},e=>{});
  db.collection('alarmas').onSnapshot(q=>{const a={};q.docs.forEach(d=>a[d.id]=clone(d.data()));S.alarms=a;render()},e=>{});
}

/* ===== configuración del parque ===== */
function autoLayout(c){
  const nC=c.circs.length;c.set=c.set||{x:70,y:350};
  for(let ci=0;ci<nC;ci++){
    const ts=c.turbs.filter(t=>t.circ===ci);const y=nC===1?420:Math.round(170+ci*(460/(nC-1)));
    ts.forEach((t,j)=>{t.x=Math.round(190+j*(720/Math.max(1,ts.length-1||1)));if(ts.length===1)t.x=400;t.y=y});
  }
}
function newCfg(nT,nC){
  const c={turbs:[],circs:[],set:{x:70,y:350},locked:false,nextId:1};
  for(let i=0;i<nC;i++)c.circs.push({name:'Circuito '+(i+1)});
  for(let i=0;i<nT;i++){c.turbs.push({id:'w'+c.nextId++,name:'WTG'+pad(i+1),circ:Math.min(nC-1,Math.floor(i*nC/nT)),x:0,y:0})}
  autoLayout(c);return c;
}
function applyCounts(nT,nC){
  const c=S.cfg;
  while(c.circs.length<nC)c.circs.push({name:'Circuito '+(c.circs.length+1)});
  c.circs.length=nC;
  c.turbs.forEach(t=>{if(t.circ>=nC)t.circ=nC-1});
  while(c.turbs.length<nT){const ci=nC-1;const last=c.turbs.filter(t=>t.circ===ci).slice(-1)[0];c.turbs.push({id:'w'+c.nextId++,name:'WTG'+pad(c.turbs.length+1),circ:ci,x:Math.min(940,last?last.x+90:400),y:last?last.y:350})}
  c.turbs.length=nT;
  if(!c.turbs.find(t=>t.id===UI.sel))UI.sel=null;
  saveCfg(true);
}

/* ===== render general ===== */
function render(){
  if(drag)return;
  renderBanner();renderHeader();
  const m=$('#main');
  if(MODE==='loading'){m.innerHTML='<div class="card">Conectando con la base de datos…</div>';return}
  if(!S.cfg){m.innerHTML=(NOTE?`<div class="note">${esc(NOTE)}</div>`:'')+setupView();return}
  let h=NOTE?`<div class="note">${esc(NOTE)}</div>`:'';
  if(MODE==='local')h+=`<div class="note">Modo local: los datos se guardan sólo en este navegador (Firebase no está configurado o no respondió).</div>`;

   <button class="pri" data-act="apply">Aplicar</button></div>
   <p class="mut" style="font-size:12px">Si reducís la cantidad, se quitan las últimas turbinas de la lista (sus registros quedan guardados por si las volvés a agregar).</p></div>
  <div class="card"><h2>Circuitos</h2>${c.circs.map((ci,i)=>`<div class="row" style="margin-bottom:6px"><i class="dot" style="background:${cc(i)}"></i><input data-cname="${i}" value="${esc(ci.name)}"><span class="mut">${c.turbs.filter(t=>t.circ===i).length} turbinas</span></div>`).join('')}</div>
  <div class="card"><div class="row" style="margin-bottom:8px"><h2 class="grow" style="margin:0">Turbinas y ubicación</h2>
   <button data-act="lock">${c.locked?'🔒 Bloqueadas':'🔓 Libres'}</button><button data-act="relayout" ${c.locked?'disabled':''}>Ordenar automáticamente</button></div>
   <p class="mut" style="font-size:12px">Coordenadas libres del mapa (X hacia la derecha, Y hacia abajo). El orden de la lista define cómo se conecta la línea de cada circuito desde la SET.</p>
   <div class="tw"><table><tr><th>#</th><th>Nombre</th><th>Circuito</th><th>X</th><th>Y</th><th>Orden</th></tr>
   ${c.turbs.map((t,i)=>`<tr><td>${i+1}</td><td><input data-ted="name" data-v="${t.id}" value="${esc(t.name)}" style="width:110px"></td>
    <td><select data-ted="circ" data-v="${t.id}">${c.circs.map((ci,j)=>`<option value="${j}" ${t.circ===j?'selected':''}>${esc(ci.name)}</option>`).join('')}</select></td>
    <td><input type="number" data-ted="x" data-v="${t.id}" value="${t.x}" ${c.locked?'disabled':''}></td>
    <td><input type="number" data-ted="y" data-v="${t.id}" value="${t.y}" ${c.locked?'disabled':''}></td>
    <td><button class="sm" data-act="up" data-v="${i}" ${i===0?'disabled':''}>▲</button> <button class="sm" data-act="down" data-v="${i}" ${i===c.turbs.length-1?'disabled':''}>▼</button></td></tr>`).join('')}</table></div></div>
  <div class="card"><h2>Zona de riesgo</h2><button class="danger" data-act="wipe">Borrar todos los registros de montaje y alarmas</button></div>`;
}

/* ===== acciones ===== */
function partClick(id,k){
  const st=pState(id,k);
  if(st==='none'){if(!reqOk(id,k)){toast('Primero hay que montar: '+PK[k].req.filter(r=>pState(id,r)!=='ok').map(r=>PK[r].n).join(', '));return}
    setPart(id,k,{inicio:nowI(),fin:null});toast(PK[k].n+': inicio de izaje registrado')}
  else if(st==='curso'){setPart(id,k,{...parts(id)[k],fin:nowI()});toast(PK[k].n+' montada ✔')}
  else{const v=parts(id)[k];toast(`${PK[k].n}: ${fmt(v.inicio)} → ${fmt(v.fin)}`)}
}
function startAlarm(target){
  const d=UI.draft;const sup=(d.sup||'').trim();if(!sup){toast('Ingresá el nombre del supervisor');return}
  try{localStorage.setItem('wtg-sup',sup)}catch(e){}
  const a={id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),turb:target,motivo:d.motivo||MOTIVOS[0],detalle:(d.detalle||'').trim(),sup,inicio:nowI(),fin:null};
  d.detalle='';saveAlarm(a);
}
document.addEventListener('click',e=>{
  const pg=e.target.closest('#tsvg [data-part]');if(pg){partClick(UI.sel,pg.dataset.part);return}
  const b=e.target.closest('[data-act]');if(!b)return;const v=b.dataset.v,c=S.cfg;
  switch(b.dataset.act){
   case 'tab':UI.tab=v;render();break;
   case 'goAlarm':if(v==='PARQUE'){UI.ov=false;UI.tab='alarmas';render()}else openOv(v);break;
   case 'create':{const nT=Math.max(1,Math.min(200,+$('#sT').value||1)),nC=Math.max(1,Math.min(10,+$('#sC').value||1));S.cfg=newCfg(nT,nC);UI.tab='mapa';saveCfg(true);break}
   case 'lock':c.locked=!c.locked;saveCfg(true);break;
   case 'mm':UI.moveMode=v;render();break;
   case 'zoom':zoomAt(+v);break;
   case 'zreset':fitAll();break;
   case 'msz':setMs(UI.ms*(+v));break;
   case 'le':UI.le=true;UI.ec=UI.ec||0;UI.selV=null;render();break;
   case 'lsave':UI.le=false;UI.selV=null;flushSaves().then(ok=>{render();toast(ok?'Líneas guardadas ✔':'Error al guardar las líneas')});break;
   case 'vdel':{const ci=c.circs[UI.ec];if(UI.selV&&ci.route&&ci.route[UI.selV.seg]){ci.route[UI.selV.seg].splice(UI.selV.i,1);UI.selV=null;saveCfg(true)}break}
   case 'rreset':modal(`<p>¿Dejar recto el recorrido de <b>${esc(cName(UI.ec))}</b>? Se borran todos sus vértices.</p>`,()=>{c.circs[UI.ec].route={};UI.selV=null;saveCfg(true)},'Dejar recto',true);break;
   case 'filt':UI.f[v]=!UI.f[v];try{localStorage.setItem('wtg-f',JSON.stringify(UI.f))}catch(_){};render();break;
   case 'ident':UI.ident=!UI.ident;try{localStorage.setItem('wtg-ident',UI.ident?'1':'0')}catch(_){};render();break;
   case 'savelock':c.locked=true;saveCfg(true);flushSaves().then(ok=>toast(ok?'Posiciones guardadas y bloqueadas 🔒':'Bloqueado, pero hubo un error al guardar'));break;
   case 'ovmin':UI.ovMin=!UI.ovMin;render();break;
   case 'ovclose':flushSaves().then(ok=>{UI.ov=false;render();toast(ok?'Montaje guardado ✔':'Revisá: hubo un error al guardar')});break;
   case 'ovnav':{const i=c.turbs.findIndex(t=>t.id===UI.sel)+(+v);if(c.turbs[i])openOv(c.turbs[i].id);break}
   case 'nav':{const i=c.turbs.findIndex(t=>t.id===UI.sel)+(+v);if(c.turbs[i]){UI.sel=c.turbs[i].id;render()}break}
   case 'openT':e.preventDefault();openOv(v);break;
   case 'pstart':case 'pend':partClick(UI.sel,v);break;
   case 'preset':modal(`<h2>${PK[v].n}</h2><p>¿Borrar el registro de esta pieza en ${esc(tName(UI.sel))}? La pieza vuelve al acopio.</p>`,()=>{
       const dep=PARTS.filter(p=>p.req.includes(v)&&pState(UI.sel,p.k)!=='none');if(dep.length){toast('Primero desmontá: '+dep.map(p=>p.n).join(', '));return}setPart(UI.sel,v,null)},'Borrar',true);break;
   case 'aon':startAlarm(v);break;
   case 'aon2':startAlarm(UI.draft.target||'PARQUE');break;
   case 'aend':{const a=S.alarms[v];if(a)saveAlarm({...a,fin:nowI()});break}
   case 'adel':modal('<p>¿Eliminar esta alarma del historial?</p>',()=>delAlarm(v),'Eliminar',true);break;
   case 'csv':{const t=csv();navigator.clipboard.writeText(t).then(()=>toast('CSV copiado. Pegalo en Excel o Sheets.'),()=>{modal(`<h2>CSV</h2><textarea style="width:100%;height:220px;background:#0b0f14;color:#e8edf3">${esc(t)}</textarea>`,()=>{},'Cerrar')});break}
   case 'apply':{const nT=Math.max(1,Math.min(200,+$('#cT').value||1)),nC=Math.max(1,Math.min(10,+$('#cC').value||1));
     if(nT<c.turbs.length||nC<c.circs.length)modal(`<p>Vas a reducir el parque a <b>${nT}</b> turbinas y <b>${nC}</b> circuitos. Se quitan las últimas de la lista.</p>`,()=>applyCounts(nT,nC),'Aplicar');else applyCounts(nT,nC);break}
   case 'relayout':autoLayout(c);saveCfg(true);toast('Posiciones reordenadas por circuito');break;
   case 'up':case 'down':{const i=+v,j=b.dataset.act==='up'?i-1:i+1;[c.turbs[i],c.turbs[j]]=[c.turbs[j],c.turbs[i]];saveCfg();break}
   case 'wipe':modal('<p><b>Se borran todos los registros de montaje y todas las alarmas.</b> La configuración y las posiciones se mantienen. No se puede deshacer.</p>',()=>{
       Object.keys(S.turb).forEach(id=>{S.turb[id]={parts:{}};saveTurb(id)});Object.keys(S.alarms).forEach(delAlarm);toast('Registros borrados')},'Borrar todo',true);break;
  }
});
document.addEventListener('input',e=>{if(e.target.dataset.cst){const ci=S.cfg.circs[UI.ec],f=e.target.dataset.cst;ci[f]=f==='w'?+e.target.value:e.target.value;const w=document.getElementById('cwv');if(w&&f==='w')w.textContent=ci.w;const m=document.getElementById('map');if(m)m.innerHTML=mapSvg();return}if(e.target.id==='msr'){setMs(+e.target.value);return}const d=e.target.dataset.draft;if(d)UI.draft[d]=e.target.value});
document.addEventListener('change',e=>{
  const el=e.target,c=S.cfg;
  if(el.dataset.draft){UI.draft[el.dataset.draft]=el.value;return}
  if(el.dataset.cst){saveCfg();return}
  if(el.dataset.act2==='ec'){UI.ec=+el.value;UI.selV=null;render();return}
  if(el.dataset.act2==='selT'){UI.sel=el.value;render();return}
  if(el.dataset.ed){const k=el.dataset.v,f=el.dataset.ed,cur={...(parts(UI.sel)[k]||{})};const val=fromInp(el.value);
    if(f==='inicio'&&!val){toast('El inicio no puede quedar vacío');render();return}
    cur[f]=val;if(cur.fin&&cur.inicio&&cur.fin<cur.inicio){toast('El fin no puede ser anterior al inicio');render();return}
    if(f==='fin'&&val&&!reqOk(UI.sel,k)){toast('Faltan piezas previas');render();return}
    setPart(UI.sel,k,cur);return}
  if(el.dataset.aed){const a={...S.alarms[el.dataset.v]};const val=fromInp(el.value);if(!val){render();return}a[el.dataset.aed]=val;if(a.fin&&a.fin<a.inicio){toast('El fin no puede ser anterior al inicio');render();return}saveAlarm(a);return}
  if(el.dataset.cname!=null){c.circs[+el.dataset.cname].name=el.value.trim()||('Circuito '+(+el.dataset.cname+1));saveCfg();return}
  if(el.dataset.ted){const t=c.turbs.find(x=>x.id===el.dataset.v);const f=el.dataset.ted;
    if(f==='name')t.name=el.value.trim()||t.name;else if(f==='circ')t.circ=+el.value;else{const n=Math.round(+el.value);t[f]=isNaN(n)?t[f]:n}
    saveCfg();return}
});
setInterval(()=>{document.querySelectorAll('[data-since]').forEach(el=>el.textContent=durS(Date.now()-new Date(el.dataset.since)))},1000);
init();
</script>
</body>
</html>
